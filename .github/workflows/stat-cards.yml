name: Generate GitHub Stat Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats Card
        uses: github-readme-stats/github-readme-stats-action@v1.4.0
        with:
          username: chirag1207
          token: ${{ secrets.METRICS_TOKEN }}
          output-folder: ./
          show_icons: true
          theme: radical

      - name: Commit Generated SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update github stats card"

name: Generate GitHub Stat Cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger anytime from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Stats Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-stats.svg
          base: header, activity, community, repositories, metadata
          plugin_lines: yes

      - name: Commit generated SVG files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update github stats [skip ci]"
